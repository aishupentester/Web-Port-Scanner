<!DOCTYPE html>
<html>

<head>

    <title>Port Scanner</title>

    <style>

        body{
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
            padding-top: 50px;
        }

        .box{
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        input{
            width: 80%;
            padding: 10px;
            margin: 10px;
        }

        button{
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>Python Port Scanner</h1>

    <form method="POST">

        <input
            type="text"
            name="target"
            placeholder="Enter IP or Domain"
            required>

        <br>

        <button type="submit">Scan</button>

    </form>

    {% if open_ports %}

        <h3>Open Ports for {{ target }}</h3>

        <ul>

            {% for port in open_ports %}

                <li>Port {{ port }} is OPEN</li>

            {% endfor %}

        </ul>

    {% endif %}

</div>

</body>
</html>
